name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, test without hardware GPU, and package
        shell: pwsh
        run: ./pack.ps1 -Version 0.8.0 -SkipGpuTests

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
